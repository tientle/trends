[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trends-pipeline"
version = "0.1.0"
description = "A reproducible Google Trends CSV validation and feature pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
trends-pipeline = "trends_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]